[env]
monitor_speed = 115200
upload_speed = 115200

[env:esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv

[env:stm32h743ii-devboard]
platform = ststm32
board = nucleo_h743zi
board_build.mcu = stm32h743iit6
board_build.f_cpu = 480000000L
board_build.ldscript = STM32H743IITX_FLASH.ld
board_upload.maximum_size = 2097152
board_upload.maximum_ram_size = 1048576
framework = stm32cube
upload_protocol = stlink
build_flags =
    ;-DEMBEDLM_SDCARD
